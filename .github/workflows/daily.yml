name: Daily snow check

on:
  schedule:
    # 14:30 UTC = 6:30 AM Pacific in winter (7:30 AM in summer daylight time)
    - cron: "30 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snow-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - name: Install headless browser (for resort pages built with JavaScript)
        run: python -m playwright install --with-deps chromium

      - name: Build report
        run: python snowcheck.py

      - name: Save results
        run: |
          git config user.name "snow-check-bot"
          git config user.email "snow-check-bot@users.noreply.github.com"
          git add data docs debug
          git diff --cached --quiet || git commit -m "Snow report $(date -u +%Y-%m-%d)"
          git push
